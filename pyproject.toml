[project]
authors = [
  {name = "Youri Westerman", email = "y.westerman@amsterdam.nl"},
  {name = "Ramon Hofmeister", email = "r.hofmeister@amsterdam.nl"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["plugfs @ git+https://github.com/Amsterdam/plugfs.git"]
description = "Framework agnostic package containing the core code for the meldingen project."
license = "EUPL-1.2"
name = "meldingen-core"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "anyio>=4.12.0,<5",
  "mkdocs-literate-nav>=0.6.1,<0.7",
  "mkdocs-material>=9.7.0,<10",
  "mkdocstrings[python]>=0.30.1,<1.1",
  "mypy>=1.18.2,<3",
  "pre-commit>=4.5.0,<5",
  "pytest>=9.0.1,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-mock>=3.15.1,<4",
  "ruff>=0.16.6",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.26,<0.13.0"]

[tool.coverage.run]
source = ["meldingen_core"]

[tool.coverage.report]
exclude_lines = ["@abstractmethod", "pragma: no cover"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.uv.build-backend]
module-name = "meldingen_core"
module-root = "."
