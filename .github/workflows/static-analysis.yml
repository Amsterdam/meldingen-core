name: Static analysis
on: [pull_request]
permissions:
  contents: read

jobs:
  FormatAndLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          enable-cache: true
          python-version: '3.13'

      - name: Install the project dependencies
        run: uv sync --frozen

      - uses: astral-sh/ruff-action@v3

  MyPy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          enable-cache: true
          python-version: '3.13'

      - name: Install the project dependencies
        run: uv sync --frozen

      - name: mypy
        run: uv run mypy --strict .
